<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbfaf6" />

  <title>Thư mời lễ tốt nghiệp — Trần Minh Quang</title>
  <meta name="description" content="Thư mời tham dự lễ tốt nghiệp của Trần Minh Quang — Chủ nhật, 02/08/2026." />

  <!-- Open Graph: hiển thị khi chia sẻ qua Zalo / Messenger / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ngày gì vậy?" />
  <meta property="og:description" content="Save the date — 02/08/2026." />
  <meta property="og:image" content="/assets/images/gate.jpg" />

  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="/assets/images/gate.jpg" />
  <link rel="preload" as="image" href="/assets/images/invite.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="is-locked">

  <div id="app">

    <!-- ================================================================
         MÀN 1 — CỔNG: tấm lịch "NGÀY GÌ VẬY", ấn vào vòng tròn để mở
         ================================================================ -->
    <section class="gate" id="gate">
      <div class="gate__frame">
        <img
          class="gate__img"
          src="/assets/images/gate.jpg"
          alt="Tấm lịch tháng 8 với dòng chữ: Ngày gì vậy"
          width="1080" height="1919"
          fetchpriority="high" />

        <!-- dấu chấm hỏi bay bay (tạo bằng JS) -->
        <div class="gate__questions" id="questions" aria-hidden="true"></div>

        <!-- vòng tròn xanh bao quanh chữ "NGÀY GÌ VẬY" -->
        <button type="button" class="gate__hotspot" id="openBtn" aria-label="Ấn để mở thiệp mời">
          <svg class="gate__circle" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true">
            <path
              pathLength="1"
              d="M150 7 C 66 7, 7 25, 7 50 C 7 76, 68 95, 152 95 C 236 95, 293 76, 293 48 C 293 22, 232 7, 148 7 C 112 7, 80 13, 58 23" />
          </svg>
          <span class="gate__hint">
            <span class="gate__hint-arrow" aria-hidden="true"></span>
            Ấn vào đây
          </span>
        </button>
      </div>
    </section>

    <!-- ================================================================
         MÀN 2+ — THIỆP (trang cuộn)
         ================================================================ -->
    <div class="invite" id="invite" tabindex="-1" hidden>

      <!-- --- 2a. Save the date --- -->
      <section class="invite__hero">
        <img
          src="/assets/images/invite.jpg"
          alt="Save the date — Trần Minh Quang's Grad Party. Chủ nhật, ngày 2 tháng 8 năm 2026. Hội trường Nguyễn Văn Đạo, Đại học Quốc gia Hà Nội, 144 Xuân Thủy, Cầu Giấy, Hà Nội."
          width="1080" height="1919" />
      </section>

    </div>

    <!-- ================================================================
         MÀN 3 — XÁC NHẬN THAM DỰ: thay hẳn màn thiệp sau ~5 giây
         ================================================================ -->
    <section class="quiz" id="quiz" tabindex="-1" hidden>
      <div class="quiz__grid" aria-hidden="true"></div>

      <div class="quiz__inner">
        <div class="quiz__intro" id="quizIntro">
          <p class="quiz__eyebrow">Chỉ một chút thôi</p>
          <h2 class="quiz__thanks">Cảm ơn bạn<br />đã đọc tới đây</h2>
          <p class="quiz__lead">
            Ngày hôm đó sẽ vui hơn rất nhiều nếu có bạn ở đó.
            Trả lời giúp mình vài câu nhé!
          </p>
        </div>

        <form class="quiz__form" id="rsvpForm" novalidate>

          <!-- Câu 1: tên -->
          <div class="field">
            <label class="field__label" for="guestName">
              <span class="field__num">1</span> Bạn là ai?
            </label>
            <input
              class="field__input"
              id="guestName" name="name" type="text"
              placeholder="Tên của bạn"
              autocomplete="name" maxlength="60" required />
            <p class="field__error" id="nameError" hidden>Cho mình xin cái tên với nhé!</p>
          </div>

          <!-- Câu 2: có đến không -->
          <fieldset class="field">
            <legend class="field__label">
              <span class="field__num">2</span> Bạn có đến dự lễ tốt nghiệp của mình không?
            </legend>

            <div class="choices">
              <label class="choice">
                <input type="radio" name="attend" value="co" required />
                <span class="choice__tick" aria-hidden="true"></span>
                <span class="choice__text">Có, mình sẽ đến</span>
              </label>

              <label class="choice">
                <input type="radio" name="attend" value="khong" />
                <span class="choice__tick" aria-hidden="true"></span>
                <span class="choice__text">Tiếc quá, mình bận mất rồi</span>
              </label>
            </div>
            <p class="field__error" id="attendError" hidden>Chọn giúp mình một ô nhé!</p>
          </fieldset>

          <!-- Câu 3: mấy giờ đến (chỉ hiện khi chọn "Có") -->
          <div class="field field--time" id="timeField" hidden>
            <label class="field__label" for="hour">
              <span class="field__num">3</span> Bạn đến được lúc mấy giờ?
            </label>
            <div class="time">
              <select class="time__select" id="hour" name="hour" aria-label="Giờ"></select>
              <span class="time__colon">:</span>
              <select class="time__select" id="minute" name="minute" aria-label="Phút"></select>
            </div>
          </div>

          <button class="btn" type="submit" id="submitBtn">Gửi câu trả lời</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>

        <!-- Màn hình sau khi gửi xong -->
        <div class="quiz__done" id="quizDone" hidden>
          <p class="quiz__done-mark" aria-hidden="true">✓</p>
          <h2 class="quiz__thanks" id="doneTitle">Nhận được rồi nhé!</h2>
          <p class="quiz__lead" id="doneLead"></p>
          <div class="quiz__done-actions">
            <button class="btn btn--ghost" type="button" id="editBtn">Sửa câu trả lời</button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="/js/main.js"></script>
</body>
</html>
